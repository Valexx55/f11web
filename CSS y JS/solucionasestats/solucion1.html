<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Estadísticas</title>
    <link rel='stylesheet' href='main.css'>
    <script src="estadisticas.js"></script>
</head>
<body>
    <div id="padre">
        <!-- Cabecera Verde -->
        <div id="remates">
            <img src="bayern.png" alt="Bayern">
            <div>REMATES</div>
            <img src="psg.png" alt="PSG">
        </div>

        <!-- Etiquetas Superiores -->
        <div id="fuerapuerta">
            <div id="fuerapuerta1">
                <div>FUERA</div>
                <div>A PUERTA</div>
            </div>
            <div id="fuerapuerta2">
                <div>A PUERTA</div>
                <div>FUERA</div>
            </div>
        </div>

        <div id="fuerapuertacolor">
            <div id="fuerapuertacolorlocal">
                <span class="num-izq">7</span>
                <span class="num-der">6</span>
            </div>
            <div id="fuerapuertacolorvisitante">
                <span class="num-izq">7</span>
                <span class="num-der">3</span>
            </div>
        </div>

        <!-- Disparos Bloqueados -->
        <div id="disparos">
            <div class="titulo-bloqueados">DISPAROS EFECTUADOS BLOQUEADOS</div>
            <div class="valores-bloqueados">
                <span>5</span>
                <span>5</span>
            </div>
            <!-- Líneas de la base -->
            <div class="lineas-contenedor">
                <div class="linea-roja"></div>
                <div class="linea-naranja"></div>
            </div>
        </div>
    </div>

</html>
