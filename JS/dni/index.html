<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<body>
    <!-- <div class="m-5"> -->
    <h1 class="ms-4 mt-4">VERIFIQUE SU LETRA DE DNI</h1>
    <form class="m-4">
        <fieldset class="mb-3">
            <legend>Seleccione el prefijo de documento</legend>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="prefijo" id="sin" checked>
                <label class="form-check-label" for="sin">
                    Sin letra
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="prefijo" id="x">
                <label class="form-check-label" for="x">
                    X
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="prefijo" id="y">
                <label class="form-check-label" for="y">
                    Y
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="prefijo" id="z">
                <label class="form-check-label" for="z">
                    Z
                </label>
            </div>
        </fieldset>
        <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label">Número de Dni</label>
            <input type="number" class="form-control" id="exampleInputEmail1" aria-describedby="dniHelp">
            <div id="dniHelp" class="form-text">Introduzca su número de dni (sin letra)</div>
        </div>
        <div class="mb-3">
            <label for="exampleInputPassword1" class="form-label">Letra</label>
            <input type="text" class="form-control" id="exampleInputPassword1">
        </div>

        <!-- <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="exampleCheck1">
                <label class="form-check-label" for="exampleCheck1">Check me out</label>
            </div> -->
        <button type="button" class="btn btn-primary" onclick="validarDni()" >Validar</button>
    </form>
    <!-- </div> -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
