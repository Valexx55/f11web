<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Juego interactivo de tablero de colores, totalmente accesible para teclado y lectores de pantalla.">
    <title>Tablero de Colores Accesible</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="index.js" defer></script>
</head>
<body>

    <div aria-live="assertive" class="solo-lector-pantalla" id="anunciador"></div>
    
    <span id="info-boton" class="solo-lector-pantalla">Presiona este cuadro para volverlo negro e inactivo.</span>

    <main>
        <h1 id="titulo-juego">Juego del Tablero de Colores</h1>
        <p class="solo-lector-pantalla">Usa las flechas de dirección para moverte por el tablero y la barra espaciadora o Enter para pintar un cuadro de negro.</p>

        <div class="contenedor" 
             role="grid" 
             aria-labelledby="titulo-juego" 
             id="tablero">
        </div>
    </main>

</body>
</html>
