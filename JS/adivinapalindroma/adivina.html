    <script language="javascript">

        function daleLaVuelta(palabraOrignal) {
            let palabraReves = "";

            //TODO: ingeniarmelas, para dar la vuelta a palabraOrignal
            for (let i = palabraOrignal.length - 1; i >= 0; i--) {
                console.log(palabraOrignal[i]);
                let letraActual = palabraOrignal[i]
                palabraReves = palabraReves + letraActual;

            }

            return palabraReves;
        }

        function esPalindroma() {
            var bd = true;
            var cad = document.getElementById("palabra").value;
            var i = 0;
            var j = cad.length - 1;

            while ((i < j) && (bd)) {
                if (cad.charAt(i) == cad.charAt(j)) {
                    bd = true;
                } else {
                    bd = false;
                }
                i++;
                j--;
            }

            console.log("bd = " + bd);
            return bd;
        }

        function esPalindroma2() {

            } else {// falso}
                capicua = false;
            }
            console.log('La palabra es palíndoma  = ' + capicua);
            return capicua;
        }
