<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario de contacto</title>
    <link rel="stylesheet" href="formulario.css">
</head>

<body>

    <h1>Formulario de contacto</h1>

    <form class="formulario">

        <div class="fila">
            <div class="campo">
                <label for="nombre">Nombre</label>
                <input id="nombre" name="nombre" type="text" required>
            </div>

            <div class="campo">
                <label for="apellidos">Apellidos</label>
                <input id="apellidos" name="apellidos" type="text" required>
            </div>
        </div>

        <div class="campo">
            <label for="email">Correo electrónico</label>
            <input id="email" name="email" type="email" required>
        </div>

        <div class="campo">
            <label for="edad">Edad</label>
            <input id="edad" name="edad" type="number" required>
        </div>

        <div class="campo">
            <label for="fecha">Fecha</label>
            <input id="fecha" name="fecha" type="date" required>
        </div>

        <fieldset class="campo campo-radio">
            <legend>Sexo</legend>

            <div class="opciones-radio">
                <div class="opcion-radio">
                    <input type="radio" id="sexo1" name="sexo" value="m">
                    <label for="sexo1">Masculino</label>
                </div>

                <div class="opcion-radio">
                    <input type="radio" id="sexo2" name="sexo" value="f">
                    <label for="sexo2">Femenino</label>
                </div>
            </div>
        </fieldset>

        <div class="campo">
            <label for="curso">Curso</label>
            <select id="curso" name="curso">
                <option value="">Selecciona un curso</option>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="js">JavaScript</option>
            </select>
        </div>

        <div class="campo">
            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" name="mensaje"></textarea>
        </div>

        <div class="campo-check">
            <input id="privacidad" name="privacidad" type="checkbox" required>
            <label for="privacidad">Acepto la política de privacidad</label>
        </div>

        <button type="submit">Enviar</button>
        <button type="reset">Limpiar</button>

    </form>

</body>

</html>
