<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <link rel='stylesheet' href='main.css'>
</head>
<body>
    <h1>LISTADO DE PRODUCTOS</h1>

    <table>
        <caption>Lista de productos comprados</caption>
        <thead>
            <tr>
                <th scope="col">PRODUCTO</th>
                <th scope="col">PRECIO</th>
                <th scope="col">UNIDADES</th>
                <th scope="col">SUBTOTAL</th>
            </tr>

        </thead>
        <tbody>
            <tr>
                <td>Teclado</td>
                <td class="numero">25 €</td>
                <td class="numero">2</td>
                <td class="numero">50 €</td>
            </tr>
            <tr>
                <td>Monitor</td>
                <td class="numero">120 €</td>
                <td class="numero">1</td>
                <td class="numero">120 €</td>
            </tr>
            <tr>
                <td>Ratón</td>
                <td class="numero">15 €</td>
                <td class="numero">3</td>
                <td class="numero">45 €</td>
            </tr>
            <tr>
                <td>Almohadillas</td>
                <td class="numero">25 €</td>
                <td class="numero">2</td>
                <td class="numero">50 €</td>
            </tr>
            <tr>
                <td>Botellas</td>
                <td class="numero">120 €</td>
                <td class="numero">1</td>
                <td class="numero">120 €</td>
            </tr>
            <tr>
                <td>Cargadores</td>
                <td class="numero">15 €</td>
                <td class="numero">3</td>
                <td class="numero">45 €</td>
            </tr>

        </tbody>
        <tfoot>
            <tr>
                <th scope="row" colspan="3" class="total">Total</th>
                <td class="numero">430 €</th>
            </tr>
        </tfoot>
    </table>
    
</body>
</html>
